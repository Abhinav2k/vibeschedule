name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Locate and Prepare APK
        id: prep
        run: |
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK found in app/build/outputs/apk/debug"
            find app/build/outputs -type f || true
            exit 1
          fi
          VERSION=$(grep 'versionName = "' app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.4.17"
          fi
          TARGET_NAME="VibeSchedule-v${VERSION}-debug.apk"
          DIR=$(dirname "$APK_FILE")
          TARGET_PATH="$DIR/$TARGET_NAME"
          if [ "$APK_FILE" != "$TARGET_PATH" ]; then
            cp "$APK_FILE" "$TARGET_PATH"
          fi
          echo "Prepared APK: $TARGET_PATH"
          echo "apk_path=$TARGET_PATH" >> $GITHUB_OUTPUT
          ARTIFACT_NAME="${TARGET_NAME%.apk}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep.outputs.artifact_name }}
          path: ${{ steps.prep.outputs.apk_path }}
          retention-days: 14
